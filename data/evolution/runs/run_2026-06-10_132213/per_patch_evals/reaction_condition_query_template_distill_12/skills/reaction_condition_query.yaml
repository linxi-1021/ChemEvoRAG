schema_version: '1.0'
name: reaction_condition_query
skill_version: 1.0.0
status: stable
description: 'Handles queries about reaction conditions: solvent, catalyst, temperature,
  time, atmosphere, or procedure.'
lifecycle:
  created_at: '2026-06-05'
  updated_at: '2026-06-05'
  owner: EVOChemRAG
trigger:
  intent: reaction_condition_query
  confidence_threshold: 0.7
  aliases:
  - condition_query
  - procedure_query
  required_signals:
  - condition_term_or_compound_reference
  negative_intents:
  - property_query
  - mechanism_query
scope:
  supported_properties:
  - solvent
  - catalyst
  - temperature
  - time
  - atmosphere
  - loading
  - procedure
  domain_constraints:
  - experimental chemistry literature
dependencies:
  prompts:
  - EVIDENCE_ASSESSMENT_SYSTEM
  - ANSWER_GENERATION_SYSTEM
  indexes:
  - entity_search
  - lexical_search
  - reaction_event_search
  - dense_search
  validators:
  - citation_validator
  core_modules:
  - ElementKG
interface:
  input_schema:
    required:
    - query
    - intent
    optional:
    - resolved_entities
    - document_context
  output_schema:
    required:
    - answer
    - evidence_items
    - confidence
    optional:
    - extracted_values
    - uncertainty_notes
strategy:
  retrieval_routing:
    primary_channels:
    - entity_search
    - reaction_event_search
    - lexical_search
    top_k:
      entity_search: 8
      lexical_search: 10
      reaction_event_search: 12
      final_rerank: 15
    boost_weights:
      table_block:
        weight: 4.0
        rationale: Reaction conditions often appear in optimization tables.
      reaction_event:
        weight: 3.0
        rationale: ReactionEventCard contains structured condition data.
      molecule_evidence:
        weight: 2.0
        rationale: Compound identity links to specific reactions.
  query_rewrite:
    enabled: true
    max_variants: 3
    diversity_threshold: 0.8
    preserve_original_query: true
    fallback_terms:
    - experimental
    - procedure
    - conditions
    - general procedure
  evidence_expansion:
    enabled: true
    expand_from_block_neighbors: true
    expand_from_molecule_mentions: true
    max_expanded_blocks: 5
  assessment:
    system_prompt_ref: EVIDENCE_ASSESSMENT_SYSTEM
    require_numeric_extraction: false
    require_citation_check: true
    failure_labels:
    - insufficient_evidence
    - condition_mismatch
    - assessment_false_negative
  answer_generation:
    system_prompt_ref: ANSWER_GENERATION_SYSTEM
    max_evidence_items: 15
    require_grounded_answer: true
    uncertainty_policy: state_uncertainty_when_evidence_is_partial
templates:
- name: solvent_extraction
  description: Extract the solvent used in a specific reaction.
  applicable_when:
    query_focus:
    - solvent
    evidence_type:
    - reaction_event
    - procedure_block
  slots:
  - reaction_id
  - solvent
  - evidence_id
- name: temperature_extraction
  description: Extract the reaction temperature from procedure text.
  applicable_when:
    query_focus:
    - temperature
    - time
    evidence_type:
    - reaction_event
    - procedure_block
  slots:
  - reaction_id
  - temperature
  - time
  - evidence_id
- name: distilled_property_extraction_table_evidence_list_reaction_condition_query
  description: Auto-distilled from 6 successful queries with structure 'property_extraction_table_evidence_list'
    in reaction_condition_query.
  applicable_when:
    intent: reaction_condition_query
    query_signals:
    - yield
    - temperature
    - solvent
    - catalyst
    query_structure: property_extraction
    evidence_type: table_evidence
  not_applicable_when: []
  slots: []
  examples: []
evaluation:
  metrics:
  - evidence_recall
  - citation_accuracy
  - answer_groundedness
  pass_criteria:
    evidence_recall: 0.9
    citation_accuracy: 0.95
    answer_groundedness: 0.9
  regression_cases_ref: eval/reaction_condition_query_regression.yaml
evolution:
  enabled: true
  mutable_paths:
  - strategy.retrieval_routing.primary_channels
  - strategy.retrieval_routing.top_k
  - strategy.retrieval_routing.boost_weights
  - strategy.query_rewrite.max_variants
  - strategy.query_rewrite.diversity_threshold
  - strategy.query_rewrite.fallback_terms
  - strategy.evidence_expansion
  - strategy.assessment
  - strategy.answer_generation
  - templates
  frozen_paths:
  - name
  - trigger.intent
  - interface.input_schema
  - dependencies.core_modules
  mutation_policy:
    allow_prompt_mutation: true
    allow_policy_mutation: true
    allow_template_addition: true
    allow_template_merge: true
    require_regression_test: true
    require_human_approval_for:
    - interface
    - dependencies
    - trigger
  failure_to_patch_mapping:
    entity_miss:
      target_paths:
      - strategy.query_rewrite
      - strategy.retrieval_routing
      allowed_operations:
      - update
      allowed_fields:
      - fallback_terms
      - diversity_threshold
      - boost_weights
    alias_miss:
      target_paths:
      - strategy.query_rewrite
      - strategy.retrieval_routing
      allowed_operations:
      - update
      allowed_fields:
      - fallback_terms
      - primary_channels
    local_id_miss:
      target_paths:
      - strategy.query_rewrite
      allowed_operations:
      - update
      allowed_fields:
      - fallback_terms
      - max_variants
    routing_error:
      target_paths:
      - strategy.retrieval_routing
      allowed_operations:
      - update
      allowed_fields:
      - primary_channels
      - top_k
      - boost_weights
    evidence_expansion_error:
      target_paths:
      - strategy.evidence_expansion
      - strategy.retrieval_routing
      allowed_operations:
      - update
      allowed_fields:
      - expand_from_block_neighbors
      - max_expanded_blocks
      - top_k
    planner_error:
      target_paths:
      - strategy.query_rewrite
      allowed_operations:
      - update
      allowed_fields:
      - diversity_threshold
    assessment_false_negative:
      target_paths:
      - strategy.assessment
      allowed_operations:
      - update
      allowed_fields:
      - system_prompt_ref
      - require_numeric_extraction
      - failure_labels
    table_reasoning_error:
      target_paths:
      - strategy.assessment
      - strategy.answer_generation
      allowed_operations:
      - update
      allowed_fields:
      - system_prompt_ref
      - max_evidence_items
    generation_error:
      target_paths:
      - strategy.answer_generation
      allowed_operations:
      - update
      allowed_fields:
      - system_prompt_ref
      - max_evidence_items
    unknown_failure:
      target_paths: []
      allowed_operations: []
safety:
  elementkg_modification: forbidden
  max_patches_per_round: 2
  consecutive_fail_limit: 3
  patch_confidence_threshold: 0.75
  uncertain_patch_queue: true
  schema_validation:
    before_patch: true
    after_patch: true
    reject_on_schema_error: true
  semantic_invariants:
  - skill_name_matches_filename
  - trigger_intent_matches_skill_name
  - all_prompt_refs_exist
  - all_mutable_paths_exist
  - no_frozen_path_modified
  risk_policy:
    low:
      allow_auto_promote_after_regression: true
    medium:
      require_regression_pass: true
      require_composition_validation: true
    high:
      require_human_approval: true
  rollback:
    snapshot_before_apply: true
    rollback_on_score_drop: true
    rollback_scope: last_promoted_patch_batch
cases:
  representative:
  - query: What solvent was used for the synthesis of compound 7?
    intent: reaction_condition_query
    expected_answer: DCE was the solvent used.
    outcome: success
  external_case_refs:
    regression_cases: eval/reaction_condition_query_regression.yaml
provenance:
  created_from:
  - manual_seed
  last_modified_by: manual_seed
  last_modified_reason: Initial seed.
changelog:
- version: 1.0.0
  round: initial
  change_type: seed
  reason: Initial skill definition.
  affected_paths: []
