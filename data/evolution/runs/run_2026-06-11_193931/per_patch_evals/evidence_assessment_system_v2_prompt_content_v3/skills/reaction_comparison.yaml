schema_version: '1.0'
name: reaction_comparison
skill_version: 1.0.0
status: stable
description: Handles queries comparing yields, conditions, or outcomes across reactions.
lifecycle:
  created_at: '2026-06-05'
  updated_at: '2026-06-05'
  owner: EVOChemRAG
trigger:
  intent: reaction_comparison
  confidence_threshold: 0.7
  aliases:
  - yield_comparison
  - condition_comparison
  required_signals:
  - comparison_keyword
  negative_intents:
  - property_query
  - mechanism_query
scope:
  supported_properties:
  - yield_comparison
  - condition_comparison
  - substrate_comparison
  domain_constraints:
  - experimental chemistry literature
dependencies:
  prompts:
  - EVIDENCE_ASSESSMENT_SYSTEM
  - ANSWER_GENERATION_SYSTEM
  indexes:
  - entity_search
  - lexical_search
  - reaction_event_search
  - dense_search
  validators:
  - citation_validator
  core_modules:
  - ElementKG
interface:
  input_schema:
    required:
    - query
    - intent
    optional:
    - resolved_entities
    - document_context
  output_schema:
    required:
    - answer
    - evidence_items
    - confidence
    optional:
    - extracted_values
    - uncertainty_notes
strategy:
  retrieval_routing:
    primary_channels:
    - reaction_event_search
    - lexical_search
    - entity_search
    top_k:
      entity_search: 8
      lexical_search: 12
      reaction_event_search: 15
      final_rerank: 15
    boost_weights:
      table_block:
        weight: 5.0
        rationale: Comparison data often appears in tables.
      numeric_match:
        weight: 2.0
        rationale: Comparison requires extracting specific numeric values.
      reaction_event:
        weight: 3.0
        rationale: Reaction events are the primary comparison target.
  query_rewrite:
    enabled: true
    max_variants: 3
    diversity_threshold: 0.8
    preserve_original_query: true
    fallback_terms:
    - comparison
    - versus
    - yield
    - higher
    - lower
    - better
  evidence_expansion:
    enabled: true
    expand_from_block_neighbors: true
    expand_from_molecule_mentions: true
    max_expanded_blocks: 5
  assessment:
    system_prompt_ref: EVIDENCE_ASSESSMENT_SYSTEM
    require_numeric_extraction: true
    require_citation_check: true
    failure_labels:
    - insufficient_evidence
    - numeric_conflict
    - comparison_ambiguity
    - assessment_false_negative
  answer_generation:
    system_prompt_ref: ANSWER_GENERATION_SYSTEM
    max_evidence_items: 15
    require_grounded_answer: true
    uncertainty_policy: state_uncertainty_when_evidence_is_partial
templates:
- name: solvent_yield_comparison
  description: Compare yields across solvents from the same table or optimization
    study.
  applicable_when:
    query_type:
    - which_higher_yield
    - solvent_comparison
    evidence_type:
    - optimization_table
    - reaction_event
  not_applicable_when:
  - yields are from different reactions/substrates without direct comparison
  slots:
  - option_a
  - option_b
  - value_a
  - value_b
  - comparison_result
  - evidence_id
evaluation:
  metrics:
  - numeric_exact_match
  - evidence_recall
  - answer_groundedness
  pass_criteria:
    numeric_exact_match: 0.85
    answer_groundedness: 0.9
  regression_cases_ref: eval/reaction_comparison_regression.yaml
evolution:
  enabled: true
  mutable_paths:
  - strategy.retrieval_routing.primary_channels
  - strategy.retrieval_routing.top_k
  - strategy.retrieval_routing.boost_weights
  - strategy.query_rewrite.max_variants
  - strategy.query_rewrite.diversity_threshold
  - strategy.query_rewrite.fallback_terms
  - strategy.evidence_expansion
  - strategy.assessment
  - strategy.answer_generation
  - templates
  frozen_paths:
  - name
  - trigger.intent
  - interface.input_schema
  - dependencies.core_modules
  mutation_policy:
    allow_prompt_mutation: true
    allow_policy_mutation: true
    allow_template_addition: true
    allow_template_merge: true
    require_regression_test: true
    require_human_approval_for:
    - interface
    - dependencies
    - trigger
  failure_to_patch_mapping:
    entity_miss:
      target_paths:
      - strategy.query_rewrite
      - strategy.retrieval_routing
      allowed_operations:
      - update
      allowed_fields:
      - fallback_terms
      - diversity_threshold
      - boost_weights
    alias_miss:
      target_paths:
      - strategy.query_rewrite
      - strategy.retrieval_routing
      allowed_operations:
      - update
      allowed_fields:
      - fallback_terms
      - primary_channels
    local_id_miss:
      target_paths:
      - strategy.query_rewrite
      allowed_operations:
      - update
      allowed_fields:
      - fallback_terms
      - max_variants
    routing_error:
      target_paths:
      - strategy.retrieval_routing
      allowed_operations:
      - update
      allowed_fields:
      - primary_channels
      - top_k
      - boost_weights
    evidence_expansion_error:
      target_paths:
      - strategy.evidence_expansion
      - strategy.retrieval_routing
      allowed_operations:
      - update
      allowed_fields:
      - expand_from_block_neighbors
      - max_expanded_blocks
      - top_k
    planner_error:
      target_paths:
      - strategy.query_rewrite
      allowed_operations:
      - update
      allowed_fields:
      - diversity_threshold
    assessment_false_negative:
      target_paths:
      - strategy.assessment
      allowed_operations:
      - update
      allowed_fields:
      - system_prompt_ref
      - require_numeric_extraction
      - failure_labels
    table_reasoning_error:
      target_paths:
      - strategy.assessment
      - strategy.answer_generation
      allowed_operations:
      - update
      allowed_fields:
      - system_prompt_ref
      - max_evidence_items
    generation_error:
      target_paths:
      - strategy.answer_generation
      allowed_operations:
      - update
      allowed_fields:
      - system_prompt_ref
      - max_evidence_items
    unknown_failure:
      target_paths: []
      allowed_operations: []
safety:
  elementkg_modification: forbidden
  max_patches_per_round: 2
  consecutive_fail_limit: 3
  patch_confidence_threshold: 0.75
  uncertain_patch_queue: true
  schema_validation:
    before_patch: true
    after_patch: true
    reject_on_schema_error: true
  semantic_invariants:
  - skill_name_matches_filename
  - trigger_intent_matches_skill_name
  - all_prompt_refs_exist
  - all_mutable_paths_exist
  - no_frozen_path_modified
  risk_policy:
    low:
      allow_auto_promote_after_regression: true
    medium:
      require_regression_pass: true
      require_composition_validation: true
    high:
      require_human_approval: true
  rollback:
    snapshot_before_apply: true
    rollback_on_score_drop: true
    rollback_scope: last_promoted_patch_batch
cases:
  representative:
  - query: 'Which solvent gave the higher yield: DCM or MeCN?'
    intent: reaction_comparison
    expected_answer: MeCN gave 85% yield vs DCM 8%.
    outcome: success
  external_case_refs:
    regression_cases: eval/reaction_comparison_regression.yaml
provenance:
  created_from:
  - manual_seed
  last_modified_by: manual_seed
  last_modified_reason: Initial seed.
changelog:
- version: 1.0.0
  round: initial
  change_type: seed
  reason: Initial skill definition.
  affected_paths: []
config/prompts/evidence_assessment_system_v2:
  yaml:
    content: "You are a chemistry research assistant. Given a user's question and\
      \ the retrieved evidence, determine whether the evidence is sufficient to answer\
      \ the question.\n\nEvidence sufficiency standard:\n- Evidence is sufficient\
      \ if it contains enough information to answer the question, either directly\
      \ or by well-supported inference.\n- Direct evidence means the evidence explicitly\
      \ states the answer.\n  Example: the evidence says \"DCE was the optimal solvent.\"\
      \n- Well-supported inference means the evidence provides concrete data that\
      \ can be logically used to answer the question.\n  Examples:\n  - A table lists\
      \ yields for several solvents, and DCE has the highest yield -> DCE can be identified\
      \ as the best solvent in that table.\n  - A compound is named \"3-(n-hexyl)-1,2-octadien-4-ol\"\
      \ -> \"Hex-n\" can reasonably refer to an n-hexyl group.\n  - A table shows\
      \ yield values -> the values can be compared to answer ranking or optimization\
      \ questions.\n- Do not require the answer to appear word-for-word if the evidence\
      \ provides enough data for a logically supported conclusion.\n- Do not infer\
      \ claims from absence of evidence, retrieval bias, or unsupported assumptions.\n\
      - For optimization, comparison, \"highest\", \"best\", or \"optimal\" questions,\
      \ the evidence must contain either:\n  1. an explicit statement of optimality\
      \ or comparison, or\n  2. comparable experimental data such as yields, conversions,\
      \ selectivities, or condition tables.\n- Evidence is insufficient when the information\
      \ needed to answer the question is missing.\n\nMANDATORY PRE-FLIGHT CHECK:\n\
      Before declaring sufficient=true or false, you MUST first extract relevant information\
      \ from EACH evidence item. This forces active reading.\n\nFor EACH evidence\
      \ item [i], state what you found:\n- What relevant data it contains (compound\
      \ names, yields, conditions, etc.)\n- What specific values you can extract (e.g.,\
      \ \"entry 5: DCE, yield 58%\")\n- Whether it directly or indirectly addresses\
      \ the question\n\nCRITICAL TABLE PARSING RULES:\n- Tables may be pipe-delimited\
      \ (cell1 | cell2 | cell3; row1 | row2) or Markdown-formatted (| col1 | col2\
      \ |\\n|---|---|\\n| val1 | val2 |).\n- When the question asks about a specific\
      \ entry/row, carefully match the entry number to the correct row and read the\
      \ target column value.\n- Do NOT assume a table is truncated just because some\
      \ rows are far apart. Check ALL visible rows for the answer.\n- A value \"85\"\
      \ in a Yield column means 85% yield — extract it even if the percent sign is\
      \ in the column header rather than the cell.\n- When comparing two entries,\
      \ extract BOTH values before concluding.\n\nREASONING STYLE:\n- If evidence\
      \ [3] says \"3d (142.1 mg, 81%) ... mp 54-55 C\" and the question asks for yield\
      \ and mp of 3d — this IS sufficient. The yield is 81% and mp is 54-55 C.\n-\
      \ If evidence [5] contains a table showing \"6 | MeCN | 85\" under a Yield column\
      \ — this IS sufficient. MeCN gave 85% yield.\n- When the question asks for a\
      \ specific compound name or identity, and the evidence provides a clear structural\
      \ or naming context (e.g., a reaction scheme, a table of compounds, or a description\
      \ of the product), you may infer the name even if it is not explicitly stated\
      \ in a single sentence. For example, if the evidence shows that compound 2a\
      \ is formed from 1a by aerobic oxidation, and 1a is cetyl alcohol (n-C15H31CH2OH),\
      \ then 2a is hexadecanoic acid (palmitic acid).\n- When the question asks for\
      \ a yield or other numerical value from a specific scale or condition, and the\
      \ evidence contains multiple entries, prioritize the entry that matches the\
      \ exact scale or condition mentioned in the question. If the evidence explicitly\
      \ states a gram-scale or large-scale yield, use that value even if other entries\
      \ show different yields.\n- When the question asks for a comparison between\
      \ two entries in a table, extract both values from the evidence and compare\
      \ them directly. Do not introduce additional comparisons or interpretations\
      \ not present in the evidence (e.g., do not compare NMR yield to isolated yield\
      \ unless the question explicitly asks for that).\n\nReturn only a JSON object:\n\
      {\n  \"sufficient\": true/false,\n  \"reason\": \"<brief explanation citing\
      \ what you found in each item>\",\n  \"refi\n"
