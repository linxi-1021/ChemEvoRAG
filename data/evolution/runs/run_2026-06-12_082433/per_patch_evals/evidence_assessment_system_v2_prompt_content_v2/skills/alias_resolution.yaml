schema_version: '1.0'
name: alias_resolution
skill_version: 1.0.0
status: stable
description: Handles queries about what an abbreviation, code-name, or chemical alias
  refers to.
lifecycle:
  created_at: '2026-06-05'
  updated_at: '2026-06-05'
  owner: EVOChemRAG
trigger:
  intent: alias_resolution
  confidence_threshold: 0.7
  aliases:
  - abbreviation_query
  - name_resolution
  required_signals:
  - alias_or_abbreviation_term
  negative_intents:
  - property_query
  - reaction_condition_query
scope:
  supported_properties:
  - canonical_name
  - iupac_name
  - smiles
  - inchikey
  - pubchem_id
  domain_constraints:
  - chemistry abbreviations and compound aliases
dependencies:
  prompts:
  - EVIDENCE_ASSESSMENT_SYSTEM
  - ANSWER_GENERATION_SYSTEM
  indexes:
  - entity_search
  - elementkg_search
  - lexical_search
  - dense_search
  - structure_search
  validators:
  - citation_validator
  core_modules:
  - ElementKG
interface:
  input_schema:
    required:
    - query
    - intent
    optional:
    - resolved_entities
    - document_context
  output_schema:
    required:
    - answer
    - evidence_items
    - confidence
    optional:
    - extracted_values
    - uncertainty_notes
strategy:
  retrieval_routing:
    primary_channels:
    - entity_search
    - elementkg_search
    - lexical_search
    top_k:
      entity_search: 10
      elementkg_search: 5
      lexical_search: 8
      final_rerank: 10
    boost_weights:
      molecule_evidence:
        weight: 5.0
        rationale: Alias resolution is about identifying chemical entities.
      entity_exact_match:
        weight: 3.0
        rationale: Exact name/alias match is strongest signal.
  query_rewrite:
    enabled: true
    max_variants: 2
    diversity_threshold: 0.8
    preserve_original_query: true
    fallback_terms:
    - canonical name
    - IUPAC
    - abbreviation
    - refers to
  evidence_expansion:
    enabled: true
    expand_from_block_neighbors: true
    expand_from_molecule_mentions: true
    max_expanded_blocks: 3
  assessment:
    system_prompt_ref: EVIDENCE_ASSESSMENT_SYSTEM
    require_numeric_extraction: false
    require_citation_check: false
    failure_labels:
    - insufficient_evidence
    - entity_miss
    - alias_miss
  answer_generation:
    system_prompt_ref: ANSWER_GENERATION_SYSTEM
    max_evidence_items: 10
    require_grounded_answer: true
    uncertainty_policy: state_uncertainty_when_evidence_is_partial
templates:
- name: abbreviation_resolution
  description: Resolve a chemical abbreviation or code-name to its full chemical name.
  applicable_when:
    query_pattern:
    - what_is_X
    - X_refers_to
    - X_stands_for
    required_signals:
    - alias_term
  slots:
  - alias
  - canonical_name
  - smiles
  - inchikey
  - evidence_id
evaluation:
  metrics:
  - evidence_recall
  - citation_accuracy
  - answer_groundedness
  pass_criteria:
    evidence_recall: 0.95
    answer_groundedness: 0.9
  regression_cases_ref: eval/alias_resolution_regression.yaml
evolution:
  enabled: true
  mutable_paths:
  - strategy.retrieval_routing.primary_channels
  - strategy.retrieval_routing.top_k
  - strategy.retrieval_routing.boost_weights
  - strategy.query_rewrite.max_variants
  - strategy.query_rewrite.diversity_threshold
  - strategy.query_rewrite.fallback_terms
  - strategy.evidence_expansion
  - strategy.assessment
  - strategy.answer_generation
  - templates
  frozen_paths:
  - name
  - trigger.intent
  - interface.input_schema
  - dependencies.core_modules
  mutation_policy:
    allow_prompt_mutation: true
    allow_policy_mutation: true
    allow_template_addition: true
    allow_template_merge: true
    require_regression_test: true
    require_human_approval_for:
    - interface
    - dependencies
    - trigger
  failure_to_patch_mapping:
    entity_miss:
      target_paths:
      - strategy.query_rewrite
      - strategy.retrieval_routing
      allowed_operations:
      - update
      allowed_fields:
      - fallback_terms
      - diversity_threshold
      - boost_weights
    alias_miss:
      target_paths:
      - strategy.query_rewrite
      - strategy.retrieval_routing
      allowed_operations:
      - update
      allowed_fields:
      - fallback_terms
      - primary_channels
    local_id_miss:
      target_paths:
      - strategy.query_rewrite
      allowed_operations:
      - update
      allowed_fields:
      - fallback_terms
      - max_variants
    routing_error:
      target_paths:
      - strategy.retrieval_routing
      allowed_operations:
      - update
      allowed_fields:
      - primary_channels
      - top_k
      - boost_weights
    evidence_expansion_error:
      target_paths:
      - strategy.evidence_expansion
      - strategy.retrieval_routing
      allowed_operations:
      - update
      allowed_fields:
      - expand_from_block_neighbors
      - max_expanded_blocks
      - top_k
    planner_error:
      target_paths:
      - strategy.query_rewrite
      allowed_operations:
      - update
      allowed_fields:
      - diversity_threshold
    assessment_false_negative:
      target_paths:
      - strategy.assessment
      allowed_operations:
      - update
      allowed_fields:
      - system_prompt_ref
      - require_numeric_extraction
      - failure_labels
    table_reasoning_error:
      target_paths:
      - strategy.assessment
      - strategy.answer_generation
      allowed_operations:
      - update
      allowed_fields:
      - system_prompt_ref
      - max_evidence_items
    generation_error:
      target_paths:
      - strategy.answer_generation
      allowed_operations:
      - update
      allowed_fields:
      - system_prompt_ref
      - max_evidence_items
    unknown_failure:
      target_paths: []
      allowed_operations: []
safety:
  elementkg_modification: forbidden
  max_patches_per_round: 2
  consecutive_fail_limit: 3
  patch_confidence_threshold: 0.75
  uncertain_patch_queue: true
  schema_validation:
    before_patch: true
    after_patch: true
    reject_on_schema_error: true
  semantic_invariants:
  - skill_name_matches_filename
  - trigger_intent_matches_skill_name
  - all_prompt_refs_exist
  - all_mutable_paths_exist
  - no_frozen_path_modified
  risk_policy:
    low:
      allow_auto_promote_after_regression: true
    medium:
      require_regression_pass: true
      require_composition_validation: true
    high:
      require_human_approval: true
  rollback:
    snapshot_before_apply: true
    rollback_on_score_drop: true
    rollback_scope: last_promoted_patch_batch
cases:
  representative:
  - query: What is DCHA?
    intent: alias_resolution
    expected_answer: DCHA refers to dicyclohexylamine.
    outcome: success
  external_case_refs:
    regression_cases: eval/alias_resolution_regression.yaml
provenance:
  created_from:
  - manual_seed
  last_modified_by: manual_seed
  last_modified_reason: Initial seed.
changelog:
- version: 1.0.0
  round: initial
  change_type: seed
  reason: Initial skill definition.
  affected_paths: []
config/prompts/evidence_assessment_system_v2:
  yaml:
    content: "You are a chemistry research assistant. Given a user's question and\
      \ the\nretrieved evidence, determine whether the evidence is sufficient to answer\n\
      the question.\n\nEvidence sufficiency standard:\n- Evidence is sufficient if\
      \ it contains enough information to answer the question, either directly or\
      \ by well-supported inference.\n- Direct evidence means the evidence explicitly\
      \ states the answer.\n  Example: the evidence says \"DCE was the optimal solvent.\"\
      \n- Well-supported inference means the evidence provides concrete data that\
      \ can be logically used to answer the question.\n  Examples:\n  - A table lists\
      \ yields for several solvents, and DCE has the highest yield -> DCE can be identified\
      \ as the best solvent in that table.\n  - A compound is named \"3-(n-hexyl)-1,2-octadien-4-ol\"\
      \ -> \"Hex-n\" can reasonably refer to an n-hexyl group.\n  - A table shows\
      \ yield values -> the values can be compared to answer ranking or optimization\
      \ questions.\n- Do not require the answer to appear word-for-word if the evidence\
      \ provides enough data for a logically supported conclusion.\n- Do not infer\
      \ claims from absence of evidence, retrieval bias, or unsupported assumptions.\n\
      - For optimization, comparison, \"highest\", \"best\", or \"optimal\" questions,\
      \ the evidence must contain either:\n  1. an explicit statement of optimality\
      \ or comparison, or\n  2. comparable experimental data such as yields, conversions,\
      \ selectivities, or condition tables.\n- Evidence is insufficient when the information\
      \ needed to answer the question is missing.\n\nMANDATORY PRE-FLIGHT CHECK:\n\
      Before declaring sufficient=true or false, you MUST first extract relevant\n\
      information from EACH evidence item. This forces active reading.\n\nFor EACH\
      \ evidence item [i], state what you found:\n- What relevant data it contains\
      \ (compound names, yields, conditions, etc.)\n- What specific values you can\
      \ extract (e.g., \"entry 5: DCE, yield 58%\")\n- Whether it directly or indirectly\
      \ addresses the question\n\nCRITICAL TABLE PARSING RULES:\n- Tables may be pipe-delimited\
      \ (cell1 | cell2 | cell3; row1 | row2) or\nMarkdown-formatted (| col1 | col2\
      \ |\\n|---|---|\\n| val1 | val2 |).\n- When the question asks about a specific\
      \ entry/row, carefully match the\nentry number to the correct row and read the\
      \ target column value.\n- Do NOT assume a table is truncated just because some\
      \ rows are far apart.\nCheck ALL visible rows for the answer.\n- A value \"\
      85\" in a Yield column means 85% yield — extract it even if the\npercent sign\
      \ is in the column header rather than the cell.\n- When comparing two entries,\
      \ extract BOTH values before concluding.\n\nREASONING STYLE:\n- If evidence\
      \ [3] says \"3d (142.1 mg, 81%) ... mp 54-55 C\" and the question\nasks for\
      \ yield and mp of 3d — this IS sufficient. The yield is 81% and mp is\n54-55\
      \ C.\n- If evidence [5] contains a table showing \"6 | MeCN | 85\" under a Yield\n\
      column — this IS sufficient. MeCN gave 85% yield.\n\nReturn only a JSON object:\n\
      {\n  \"sufficient\": true/false,\n  \"reason\": \"<brief explanation citing\
      \ what you found in each item>\",\n  \"refined_query\": \"<a new search query\
      \ to find missing information, or null>\"\n}\n\nAdditional rules:\n- If sufficient=true,\
      \ explain WHICH evidence item(s) contain the answer and\nwhat specific data\
      \ you extracted.\n- If sufficient=false, list what information IS present vs\
      \ what is missing,\nthen provide a refined_query using alternative keywords,\
      \ synonyms, compound\nnames, reaction terms, table names, or condition-related\
      \ terms.\n- Do not simply repeat the user's original question as refined_query.\n\
      - If the question is too vague, the evidence is completely unrelated, or no\n\
      useful search query can be formulated, set refined_query=null.\n\n--- NEW TARGETED\
      \ RULES (V2) ---\n\n1. TERM-PRESENCE CHECK FOR ALIAS/DEFINITION QUESTIONS:\n\
      \   When the question asks for the meaning or definition of a specific term\
      \ or label (e.g., \"What does 'Hex-n' mean?\"), the evidence is sufficient if\
      \ ANY evidence item contains the term itself, a definition of the term, or a\
      \ compound name that includes the term as a substituent (e.g., \"3-(n-hexyl)-1,2-octadien-4-ol\"\
      \ for 'Hex-n'). Do NOT require the term to appear in isolation; a compound name\
      \ containing the term is sufficient. If the evidence contains such a compound\
      \ name, you must infer that the term refers to the corresponding group (e.g.,\
      \ n-hexyl).\n\n2. INFERENCE FROM COMPOUND NAMES:\n   If a compound name in the\
      \ evidence includes a substituent abbreviation (e.g., \"n-hexyl\" in \"3-(n-hexyl)-1,2-octadien-4-ol\"\
      ), and the question asks what that abbreviation (e.g., \"Hex-n\") means, the\
      \ evidence is sufficient. The inference that \"Hex-n\" means n-hexyl is well-supported\
      \ by the compound name. Do not mark such evidence as insufficient solely because\
      \ the abbreviation itself is not explicitly defined.\n\n3. NO OVER-REQUIREMENT\
      \ OF EXPLICIT DEFINITION:\n   Do not require an explicit statement like \"Hex-n\
      \ is defined as n-hexyl\" when the evidence contains a compound name that uses\
      \ the group. The presence of the group in a compound name is enough to answer\
      \ the question. If the evidence contains such a compound name, set sufficient=true\
      \ and explain the inference.\n\n4. PRE-FLIGHT CHECK MUST INCLUDE TERM SCAN:\n\
      \   In the mandatory pre-flight check, for each evidence item, explicitly state\
      \ whether the item contains the specific term or label from the question (e.g.,\
      \ \"Hex-n\") or a compound name that includes the corresponding group. If any\
      \ item does, note that as relevant data."
