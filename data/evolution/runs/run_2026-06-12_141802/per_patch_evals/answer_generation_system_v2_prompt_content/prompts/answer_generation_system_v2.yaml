  in ''3-(n-hexyl)-1,2-octadien-4-ol'') are sufficient to answer what the label means.;
  Added rule: Structural formula from compound name and data — a systematic name plus
  supporting data (NMR, SMILES) is sufficient to deduce the full structure, even without
  an image.'
